# Configuration for the Urban Company 90-Day Repeat Discovery Engine
project:
  name: "urban-company-repeat-discovery"
  anchor_metric: "90-day repeat booking rate after a completed core-category anchor booking"
  min_words_after_filter: 6
  exclude_instahelp: true

# Keyword filter used during Stage 1 collection to keep substantive home-service
# and repeat-behavior posts mapped to all 8 discovery questions in the brief.
keywords:
  # Broad service anchors (Stage 3 AI filter removes passing mentions later)
  broad_service_anchors:
    - "urban company services"
    - "urban company service"
    - "uc services"
    - "uc service"
    - "home services"
    - "home service"

  # Q1: Post-booking expectations & post-service care
  post_booking_expectations:
    - "warranty"
    - "follow up"
    - "followup"
    - "reminder"
    - "after service"
    - "post service"
    - "after booking"
    - "after finishing"
    - "after work"
    - "inspection"
    - "check after"
    - "invoice"
    - "exclusion"
    - "excluded"
    - "rate card"

  # Q2: Need triggers & timing (how/when households decide a service is needed)
  need_triggers_and_timing:
    - "every month"
    - "monthly"
    - "quarterly"
    - "once a year"
    - "every 3 months"
    - "every 6 months"
    - "schedule"
    - "reschedule"
    - "slot"
    - "regular"
    - "routine"
    - "maintenance"
    - "summer"
    - "monsoon"
    - "diwali"
    - "festival"
    - "festive"
    - "guests"
    - "shifting"
    - "moving"
    - "emergency"
    - "urgent"
    - "stopped working"
    - "weekend"

  # Q3 & Q4 & Q6: Repeat vs non-repeat, same/different category, returners vs non-returners
  repeat_and_behavior:

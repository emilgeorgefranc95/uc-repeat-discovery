sources:
  play_store:
    enabled: true
    app_id: "com.urbanclap.urbanclap"
    lang: "en"
    country: "in"
    max_reviews: 30000
    # Pull balanced reviews across star ratings to counter Bias #1 (1-star dominance)
    balanced_by_rating: true
    sort: "newest"
    output_file: "data/raw/play_store.jsonl"

  app_store:
    enabled: true
    app_id: "1032480595"
    country: "in"
    max_pages: 10
    output_file: "data/raw/app_store.jsonl"

  trustpilot:
    enabled: true
    domain: "www.urbancompany.com"
    max_pages: 25
    output_file: "data/raw/trustpilot.jsonl"

  youtube:
    enabled: true
    region_code: "IN"
    relevance_language: "en"
    max_videos_per_query: 6
    max_comments_per_video: 100
    # Mix of Urban Company reviews AND general Indian home-service discussions (counters Bias #2)
    queries:
      - "Urban Company review India"
      - "Urban Company deep cleaning review"
      - "Urban Company AC service review"
      - "Urban Company salon at home review"
      - "home deep cleaning service India experience"
      - "AC service at home India local vs Urban Company"
      - "salon at home vs parlour India"
      - "bathroom deep cleaning Urban Company"
    output_file: "data/raw/youtube.jsonl"

  # Stage 5 (built later in Prompt 7 using Apify within $3.50 budget cap)
  reddit:
    enabled: false
    budget_usd: 3.50
    subreddits:
      - "bangalore"
      - "mumbai"
      - "delhi"
      - "hyderabad"
      - "pune"
      - "india"
      - "chennai"
      - "TwoXIndia"
      - "gurgaon"
    queries:
      - "Urban Company"
      - "Urban Company worth it"
      - "Urban Company vs local"
      - "Urban Company AC service"
      - "Urban Company deep cleaning"
      - "Urban Company salon"
      - "plumber electrician Urban Company"
    manual_threads_file: "data/manual/reddit_threads.txt"
    output_file: "data/raw/reddit.jsonl"
